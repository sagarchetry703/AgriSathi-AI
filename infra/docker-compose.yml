# AgriSathi AI — Local Development Infrastructure
# =================================================
# Usage: docker compose -f infra/docker-compose.yml up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agrisathi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agrisathi
      POSTGRES_PASSWORD: agrisathi_dev
      POSTGRES_DB: agrisathi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrisathi -d agrisathi_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agrisathi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
